<!doctype html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>RDS by C2TECH v2.7.1</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0e4a38" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RDS" />
    <link rel="apple-touch-icon" href="assets/icon-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700;800&family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="loading">
        <div class="loading-content">
            <div class="logo big">RDS</div>
            <b>Roller Diamond Stock</b>
            <p>by C2TECH · <span data-en="Loading...">กำลังโหลดข้อมูล...</span></p>
        </div>
    </div>

    <header class="top">
        <div class="logo">RDS</div>
        <div class="t"><b>RDS <span class="ver">v2.7.1</span></b><small>Roller Diamond Stock · by C2TECH</small></div>
        <span class="admin-chip" id="admin-chip" hidden>Admin</span>
        <button class="ibtn hdr-gear" id="hdr-manage" onclick="showPage('manage')" aria-label="ตั้งค่าระบบ" data-en-label="Settings" hidden>⚙️</button>
        <button class="ibtn lang-btn" id="lang-btn" onclick="setLang(LANG === 'en' ? 'th' : 'en')" aria-label="Switch to English">EN</button>
        <button class="ibtn" id="admin-btn" onclick="toggleAdmin()" aria-label="เข้าสู่ระบบ Admin" data-en-label="Admin sign-in"></button>
        <button class="ibtn" id="main-refresh" onclick="fetchData()" aria-label="รีเฟรชข้อมูล" data-en-label="Refresh data">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" /></svg>
        </button>
    </header>

    <div class="shell">
        <aside class="side">
            <button class="newbtn" onclick="openSheet()" data-en="＋ Record entry">＋ บันทึกรายการ</button>
            <button class="nitem on" data-nav="exec" onclick="showPage('exec')">📈 Dashboard</button>
            <button class="nitem" data-nav="stock" onclick="showPage('stock')" data-en="📦 Inventory">📦 คลังสินค้า</button>
            <button class="nitem" data-nav="hist" onclick="showPage('hist')" data-en="🕒 History">🕒 ประวัติ</button>
            <button class="nitem" data-nav="dash" onclick="showPage('dash')" data-en="📊 Overview">📊 ภาพรวม</button>
            <button class="nitem" data-nav="manage" id="side-manage" onclick="showPage('manage')" data-en="⚙️ Settings" hidden>⚙️ ตั้งค่าระบบ</button>
            <div class="foot">RDS by C2TECH · v2.7.1</div>
        </aside>

        <main>
            <section class="page" id="page-dash"></section>
            <section class="page" id="page-stock"></section>
            <section class="page" id="page-hist"></section>
            <section class="page" id="page-rec"></section>
            <section class="page active" id="page-exec"></section>
            <section class="page" id="page-manage"></section>
        </main>
    </div>

    <nav class="bnav" aria-label="เมนูหลัก" data-en-label="Main menu">
        <button class="on" data-nav="exec" onclick="showPage('exec')"><span class="i">📈</span>Dashboard</button>
        <button data-nav="stock" onclick="showPage('stock')"><span class="i">📦</span><span data-en="Stock">คลัง</span></button>
        <div><div class="fab" role="button" tabindex="0" aria-label="บันทึกรายการ" data-en-label="Record entry" onclick="openSheet()">＋</div></div>
        <button data-nav="hist" onclick="showPage('hist')"><span class="i">🕒</span><span data-en="History">ประวัติ</span></button>
        <button data-nav="dash" onclick="showPage('dash')"><span class="i">📊</span><span data-en="Overview">ภาพรวม</span></button>
    </nav>
    <div id="cartbar-slot"></div>

    <div class="sheet-back" id="sheet-back" hidden onclick="closeSheet()"></div>
    <div class="sheet" id="sheet" role="dialog" aria-label="บันทึกรายการ" data-en-label="Record entry">
        <div class="grab"></div>
        <h3 data-en="Record entry">บันทึกรายการ</h3>
        <div class="act-grid">
            <button class="act" onclick="startRec('sale')"><div class="i a-sale">💰</div><b data-en="Sale">ขายสินค้า</b><small data-en="Deducts stock now">ตัดสต็อกทันที</small></button>
            <button class="act" onclick="startRec('trial')"><div class="i a-trial">🧪</div><b data-en="Send trial">ส่งทดลอง</b><small data-en="Close as sale / return later">ปิดเป็นขาย/รับคืนทีหลัง</small></button>
            <button class="act" onclick="startRec('in')"><div class="i a-in">📥</div><b data-en="Receive">รับเข้า</b><small data-en="New stones or Used returns">หินใหม่ หรือรับคืน Used</small></button>
            <button class="act" onclick="startRec('claim')"><div class="i a-claim">🛡️</div><b data-en="Claim">เคลมสินค้า</b><small data-en="Replace stones for a customer">เปลี่ยนหินให้ลูกค้า</small></button>
        </div>
    </div>
    <div id="modal-slot"></div>

    <script src="script.js"></script>
</body>
</html>
